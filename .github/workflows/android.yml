name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q hutir-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: app
      - run: npx cap sync android
        working-directory: app
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: hutir-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - run: cp app/android/app/build/outputs/apk/debug/app-debug.apk hutir.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ github.event.head_commit.message || 'Хутір' }}
          make_latest: true
          files: hutir.apk
