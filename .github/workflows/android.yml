name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q hutir-android.zip
      - name: Music from server
        run: |
          mkdir -p app/www/music
          for n in $(node -e "const t=require('fs').readFileSync('app/www/index.html','utf8');const m=t.match(/const MUSF=(\{[^;]*\});/);console.log(Object.values(eval('('+m[1]+')')).flat().join(' '))"); do
            curl -fsSL --retry 3 -o app/www/music/$n.mp3 https://generated.biz.ua/hutir/music/$n.mp3 || { echo "::warning::no $n.mp3"; rm -f app/www/music/$n.mp3; }
          done
          ls -la app/www/music
      - name: Version + fixed signing key
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Add repo secret KS_PASS (Settings → Secrets → Actions)"; exit 1; fi
          V=$(grep -o "const GAMEV='[0-9]*'" app/www/index.html | grep -o '[0-9]*')
          echo "V=$V" >> $GITHUB_ENV
          G=app/android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $V/; s/versionName \"[^\"]*\"/versionName \"$V\"/" $G
          cat >> $G <<'GR'
          android { signingConfigs { debug {
            storeFile file(rootProject.projectDir.path + '/../../hutir.keystore')
            storePassword System.getenv('KS_PASS'); keyAlias 'hutir'; keyPassword System.getenv('KS_PASS')
          } } }
          GR
          grep -n "versionCode\|versionName" $G
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: app
      - run: npx cap sync android
        working-directory: app
      - run: chmod +x gradlew && ./gradlew assembleDebug
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: hutir-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - run: cp app/android/app/build/outputs/apk/debug/app-debug.apk hutir.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}-b${{ github.run_number }}
          name: Хутір v${{ env.V }}
          make_latest: true
          files: hutir.apk
